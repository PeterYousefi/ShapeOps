name: ShapeOps quality
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: shapeops-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6 libsm6
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: python scripts/workflow_policy.py
      - run: ruff check backend scripts tests --select F
      - run: mypy backend --ignore-missing-imports --follow-imports=silent
      - run: pip-audit -r requirements.txt
      - run: npm audit --omit=dev
      - run: python -m pytest -q
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start application
        run: |
          uvicorn backend.app:app --port 8000 > /tmp/shapeops-api.log 2>&1 &
          npm run dev -- --port 5173 > /tmp/shapeops-ui.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/health && break || sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/health
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/*.png
            artifacts/evaluation.json
            test-results/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: docker build -t shapeops:ci .
      - name: Scan built image with official Trivy container
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/artifacts:/reports" aquasec/trivy:0.76.0 image --scanners vuln --severity CRITICAL --exit-code 1 --format json --output /reports/container-audit.json shapeops:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-security-evidence
          path: artifacts/container-audit.json

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with: { install_only: true }
      - run: ./scripts/kind-smoke.sh
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - name: Install checksum-verified Terraform scanner
        run: ./scripts/install-trivy.sh "$RUNNER_TEMP/shapeops-trivy"
      - name: Terraform security gate and positive control
        run: ./scripts/terraform-security.sh "$RUNNER_TEMP/shapeops-trivy/trivy"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: terraform-security-evidence
          path: artifacts/terraform-security*.json
