name: Deployment preparation only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shapeops-production
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Approval boundary
        run: |
          echo 'This workflow does not provision infrastructure or deploy.'
          echo 'Azure deployment requires explicit owner authorization, OIDC configuration, completed scans and validated resource sizing.'
          echo 'See docs/azure-readiness.md for the remaining release prerequisites.'
